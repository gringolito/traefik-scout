name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .tool-versions

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise run test

  publish:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs cmd/imagetags below to resolve the tags to publish.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The build publishes the release tag itself plus the vX.Y, vX, and
      # latest aliases. Each alias is included only when the tagged release is the
      # newest in its semver series, so a backport release can never move a
      # newer alias or latest backward. cmd/imagetags makes that decision
      # from the release tags already published on Docker Hub; the Docker
      # Hub v2 API is unauthenticated but paginated, so page through all of
      # them. A 404 on the first page means the image does not exist yet
      # (first-ever release, no published tags); any other error fails.
      - name: Resolve image tags
        id: tags
        run: |
          base_url="https://hub.docker.com/v2/repositories/gringolito/traefik-scout/tags?page_size=100"
          url="$base_url"
          : > published-tags.txt
          while [ -n "$url" ]; do
            set +e
            response="$(curl -fsSL "$url")"
            status=$?
            set -e
            if [ "$status" -eq 22 ] && [ "$url" = "$base_url" ]; then
              response='{"results":[]}'
            elif [ "$status" -ne 0 ]; then
              exit 1
            fi
            jq -r '.results[].name' <<<"$response" >> published-tags.txt
            url="$(jq -r '.next // empty' <<<"$response")"
          done
          {
            echo 'tags<<EOF'
            go run ./cmd/imagetags "$GITHUB_REF_NAME" < published-tags.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # One buildx build with every resolved tag: all tags land on the same
      # multi-arch digest.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
