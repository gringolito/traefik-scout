edge_entrypoints:
  - websecure
downstreams:
  - name: secondary
    api_address: http://traefik-secondary:8080
    traffic_address: http://traefik-secondary:80
    allowed_entrypoints:
      - web
      - websecure
    priority_offset: 10
    staleness_limit: 2m
    auth:
      username: admin
      password: secret
    tls:
      ca: /etc/ssl/ca.crt
      insecure_skip_verify: false
