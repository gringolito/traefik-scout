# traefik-scout example configuration.
#
# ---------------------------------------------------------------------------
# Global settings
# ---------------------------------------------------------------------------

# Address the HTTP server listens on. The served configuration and the
# /healthz, /readyz, and /metrics endpoints are all exposed here.
# Default: ":8080"
listen: ":8080"

# URL path under which the merged dynamic configuration is served. This is the
# URL you give the edge Traefik's `http` provider.
# Default: "/config"
config_path: "/config"

# How often each downstream's API is polled. A new service appears at the edge
# within one poll interval.
# Default: "30s"
poll_interval: 30s

# Per-request timeout for a single downstream API call. Set this below the
# poll interval so one slow downstream cannot consume the whole polling budget.
# Default: "5s"
request_timeout: 5s

# Maximum accepted size of a downstream's /api/rawdata response, in bytes.
# Protects against a misbehaving endpoint exhausting memory.
# Default: 10485760 (10 MiB)
max_response_size: 10485760

# Entrypoint names the generated routers are bound to on the edge. Downstream
# and edge entrypoint names are unrelated: routes found on a downstream's
# `web`/`websecure` entrypoints are rebound to these names at the edge.
# This is where your wildcard certificate lives, typically.
edge_entrypoints:
  - websecure

# Log verbosity: one of "debug", "info", "warn", "error".
# Default: "info"
log_level: info

# Log output format: "text" (human-readable key=value) or "json" (one JSON
# object per line, for log shippers).
# Default: "text"
log_format: text

# ---------------------------------------------------------------------------
# Downstreams: one entry per upstream Traefik instance
# ---------------------------------------------------------------------------

downstreams:
  # Internal identifier, used to prefix every router this downstream
  # contributes ({name}-{router}) so two hosts defining a router called
  # `dashboard` do not collide. Allowed characters: a-z, A-Z, 0-9, _, -.
  # Required, must be unique.
  - name: docker-host

    # How traefik-scout polls the downstream Traefik API for its routers.
    api:
      # Base URL that /api/rawdata is polled on. This is the traefik
      # entrypoint, or an explicitly exposed api@internal router, never the
      # Docker socket. Required, absolute URL.
      address: http://docker-host.lan:8080

      # Optional: credentials for the API. Exactly one of:
      #   - static headers (bearer tokens, API keys), or
      #   - username + password (HTTP basic auth).
      # Setting both, or only one of username/password, fails validation.
      auth:
        headers:
          Authorization: "Bearer change-me"

      # Optional: TLS settings for polling the API over HTTPS. Files are read
      # by traefik-scout.
      #   ca                    path to a PEM CA bundle for a private/self-signed
      #                         downstream certificate. Default: system roots.
      #   cert / key            client certificate and key for mTLS. Must be
      #                         set together.
      #   insecure_skip_verify  skip certificate verification. Escape hatch
      #                         only. Default: false.
      tls:
        ca: /etc/traefik-scout/downstream-ca.crt
        cert: /etc/traefik-scout/client.crt
        key: /etc/traefik-scout/client.key
        insecure_skip_verify: false

    # How the edge Traefik forwards user traffic to this downstream. Emitted
    # into the served configuration; traefik-scout never connects here itself.
    traffic:
      # Where user traffic is sent for this downstream's routers. Independent
      # of api.address: you typically poll the API on one port and route
      # traffic on another. Use https:// to keep the edge-to-downstream hop
      # encrypted, for instance to target a downstream `websecure` entrypoint.
      # Required, absolute URL.
      address: https://docker-host.lan:443

      # Optional: TLS settings for the edge's connection to an https://
      # address.
      #   insecure_skip_verify  encrypt the hop but skip certificate
      #                         verification, for downstreams serving
      #                         self-signed certificates while the edge owns
      #                         the real one. Emitted as a serversTransport
      #                         scoped to this downstream's service only.
      #                         Default: false.
      tls:
        insecure_skip_verify: true

    # Which of the downstream's own entrypoints are aggregated. Routers bound
    # only to other downstream entrypoints (host-local tooling, for instance)
    # are never published at the edge. Required.
    allowed_entrypoints:
      - web
      - websecure

    # Optional: bias this downstream's routers ahead of (positive) or behind
    # (negative) another downstream's when their rules overlap.
    # Default: 0
    priority_offset: 100

    # Optional: withdraw this downstream's routes after this long without a
    # successful poll. Disabled by default, keeping last-known-good routes is
    # the safer failure mode; opt in when a decommissioned host should
    # eventually stop producing bad gateways.
    # Default: disabled (routes are served indefinitely)
    staleness_limit: 5m

  # A second downstream: the minimal form. Only the required fields; every
  # global and optional value falls back to its default.
  - name: gpu-host
    api:
      address: http://gpu-host.lan:8080
    traffic:
      address: http://gpu-host.lan:80
    allowed_entrypoints:
      - web
      - websecure
